<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero Financiero</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e3e6eb;--up:#0a7d3c;--dn:#c0262d;--ac:#1d4ed8;--sel:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1319;--card:#171c24;--tx:#e8ebf0;--mut:#8b95a5;--bd:#262d38;--up:#35c27a;--dn:#ff6b6b;--ac:#7aa2ff;--sel:#1e2a4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:12px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:12px;color:var(--mut)}select,button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;font:inherit}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
nav button{cursor:pointer}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 16px 32px}
section{display:none}section.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.card .n{color:var(--mut);font-size:12px}.card .v{font-size:20px;font-weight:600;margin:2px 0}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:16px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mut);font-weight:600;background:var(--card)}
tr:last-child td{border-bottom:0}.wrap{overflow-x:auto}
h2{font-size:15px;margin:18px 0 8px}
.warn{background:var(--sel);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin:0 16px 12px;font-size:12px}
svg.sp{width:90px;height:24px;vertical-align:middle}
footer{padding:0 16px 24px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
  <div><h1>Tablero Financiero</h1><div class="sub" id="gen">Cargando…</div></div>
  <div class="ctl">
    <label>Tipo de cambio ARS <select id="tc"></select></label>
    <button id="reload">Actualizar vista</button>
  </div>
</header>
<div class="warn" id="warn" hidden></div>
<nav id="nav"></nav>
<main id="main"></main>
<footer id="foot"></footer>
<script src="data/latest.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const nf = (d) => new Intl.NumberFormat("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt = (v, d = 2) => (v == null || isNaN(v) ? "—" : nf(Math.abs(v) >= 1000 ? Math.min(d, 2) : v < 1 && v > -1 ? Math.max(d, 4) : d).format(v));
const fvol = (v) => (v == null ? "—" : v >= 1e9 ? nf(2).format(v / 1e9) + " B" : v >= 1e6 ? nf(2).format(v / 1e6) + " M" : v >= 1e3 ? nf(1).format(v / 1e3) + " K" : nf(0).format(v));
const cls = (v) => (v == null ? "mut" : v >= 0 ? "up" : "dn");
const fpct = (v) => (v == null || isNaN(v) ? "—" : `<span class="${cls(v)}">${v >= 0 ? "▲" : "▼"} ${nf(2).format(Math.abs(v))}%</span>`);
function spark(s) {
  if (!s || s.length < 2) return "";
  const mn = Math.min(...s), mx = Math.max(...s), r = mx - mn || 1;
  const pts = s.map((v, i) => `${(i / (s.length - 1)) * 90},${22 - ((v - mn) / r) * 20}`).join(" ");
  const up = s[s.length - 1] >= s[0];
  return `<svg class="sp" viewBox="0 0 90 24"><polyline fill="none" stroke="var(--${up ? "up" : "dn"})" stroke-width="1.5" points="${pts}"/></svg>`;
}
const state = { tab: "resumen", tc: "mep", ver: {}, en: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem("tablero") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("tablero", JSON.stringify({ tab: state.tab, tc: state.tc, ver: state.ver, en: state.en })); } catch (e) {} };

const TABS = [["resumen","Resumen"],["monedas","Monedas"],["bonos","Bonos AR"],["commodities","Commodities"],["indices","Índices"],["acc_ar","Acciones argentinas"],["acc_ex","Acciones extranjeras"],["fuentes","Fuentes"]];

function tcARS() { const d = TABLERO.dolar_ar.find((x) => x.id === state.tc); return d && !d.error ? d.venta : null; }
function usdPer(cur) { if (cur === "USD") return 1; if (cur === "ARS") { const t = tcARS(); return t ? 1 / t : null; } const m = TABLERO.monedas.find((x) => x.id === cur); return m?.usd_por_unidad ?? null; }
function convertir(v, de, a) { if (v == null || de === a) return v; const u = usdPer(de), t = usdPer(a); return u && t ? (v * u) / t : null; }

const card = (n, v, p, extra = "") => `<div class="card"><div class="n">${n}</div><div class="v">${v}</div><div>${fpct(p)} ${extra}</div></div>`;

function vResumen() {
  const D = TABLERO;
  return `<h2>Dólar en Argentina (ARS por USD)</h2><div class="grid">${D.dolar_ar.map((d) => d.error ? card(d.nombre, "—", null) : card(d.nombre, "$ " + fmt(d.venta), d.variacion, `<span class="mut">${d.fuente}</span>`)).join("")}</div>
  <h2>Índices</h2><div class="grid">${D.indices.map((i) => i.error ? card(i.nombre, "—", null) : card(i.nombre, fmt(i.precio), i.var_pct, spark(i.serie))).join("")}</div>
  <h2>Commodities</h2><div class="grid">${D.commodities.map((c) => c.error ? card(c.nombre, "—", null) : card(c.nombre, fmt(c.precio), c.var_pct, `<span class="mut">${c.unidad}</span>`)).join("")}</div>`;
}
function vMonedas() {
  const D = TABLERO, t = tcARS();
  const rows = D.monedas.filter((m) => !m.oculta && m.id !== "USD").map((m) => {
    const u = m.usd_por_unidad, ars = u && t ? u * t : null;
    return `<tr><td><b>${m.id}</b> <span class="mut">${m.nombre}</span></td><td>${m.error ? "—" : fmt(u, 4)}</td><td>${u ? fmt(1 / u, 4) : "—"}</td><td>${m.id === "ARS" ? "—" : "$ " + fmt(ars)}</td><td>${fpct(m.var_pct)}</td><td>${spark(m.serie)}</td></tr>`;
  }).join("");
  return `<h2>Monedas (referencia: Yahoo Finance)</h2><div class="wrap"><table><thead><tr><th>Moneda</th><th>USD por 1 unidad</th><th>Unidades por 1 USD</th><th>ARS por 1 unidad (${state.tc.toUpperCase()})</th><th>Var. día</th><th>30 días</th></tr></thead><tbody>${rows}</tbody></table></div>
  <h2>Dólar en Argentina</h2><div class="wrap"><table><thead><tr><th>Tipo</th><th>Compra</th><th>Venta</th><th>Var.</th><th>Fuente</th><th>Actualizado</th></tr></thead><tbody>${D.dolar_ar.map((d) => `<tr><td>${d.nombre}</td><td>${d.error ? "—" : d.compra ? fmt(d.compra) : "—"}</td><td>${d.error ? "—" : fmt(d.venta)}</td><td>${fpct(d.variacion)}</td><td class="mut">${d.fuente || ""}</td><td class="mut">${d.fecha || ""}</td></tr>`).join("")}</tbody></table></div>`;
}
function vBonos() {
  const rows = TABLERO.bonos.map((b) => b.error ? `<tr><td>${b.id}</td><td colspan="6" class="mut">sin datos</td></tr>` :
    `<tr><td><b>${b.id}</b></td><td>${fmt(b.precio_ars)}</td><td>${fpct(b.var_ars)}</td><td>${fvol(b.volumen_ars)}</td><td>${fmt(b.precio_usd)}</td><td>${fpct(b.var_usd)}</td><td>${fvol(b.volumen_usd)}</td></tr>`).join("");
  return `<h2>Bonos soberanos argentinos</h2><div class="wrap"><table><thead><tr><th>Bono</th><th>Precio ARS</th><th>Var.</th><th>Volumen ARS (nominal)</th><th>Precio USD (MEP)</th><th>Var.</th><th>Volumen USD</th></tr></thead><tbody>${rows}</tbody></table></div><div class="sub">Fuente: data912 (BYMA). Precio por cada 100 de valor nominal. Para sumar bonos, editar config.json → bonos.lista.</div>`;
}
function vSimple(lista, titulo) {
  const rows = lista.map((c) => c.error ? `<tr><td>${c.nombre}</td><td colspan="6" class="mut">sin datos</td></tr>` :
    `<tr><td><b>${c.nombre}</b> ${c.unidad ? `<span class="mut">${c.unidad}</span>` : ""}</td><td>${fmt(c.precio)}</td><td>${fpct(c.var_pct)}</td><td>${fmt(c.previo)}</td><td>${fmt(c.max52)}</td><td>${fmt(c.min52)}</td><td>${spark(c.serie)}</td></tr>`).join("");
  return `<h2>${titulo}</h2><div class="wrap"><table><thead><tr><th>Componente</th><th>Último</th><th>Var. día</th><th>Cierre prev.</th><th>Máx 52s</th><th>Mín 52s</th><th>30 días</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function vAcciones(lista, titulo, grp) {
  const rows = lista.map((a) => {
    const ok = a.cotizaciones.filter((q) => !q.error);
    if (!ok.length) return `<tr><td><b>${a.nombre}</b></td><td colspan="8" class="mut">${a.nota || "sin datos"}</td></tr>`;
    const k = grp + a.id;
    const ver = ok.find((q) => q.mercado === state.ver[k]) || ok[0];
    const en = state.en[k] || "orig";
    const dest = en === "orig" ? ver.moneda : en;
    const c = (v) => convertir(v, ver.moneda, dest);
    const sel = `<select data-k="${k}" data-t="ver">${ok.map((q) => `<option ${q === ver ? "selected" : ""}>${q.mercado}</option>`).join("")}</select>`;
    const opts = [["orig", "Original (" + ver.moneda + ")"], ["USD", "USD"], ["ARS", "ARS"]];
    const sel2 = `<select data-k="${k}" data-t="en">${opts.map(([v, l]) => `<option value="${v}" ${v === en ? "selected" : ""}>${l}</option>`).join("")}</select>`;
    const conv = en !== "orig" && dest !== ver.moneda;
    return `<tr><td><b>${a.nombre}</b> <span class="mut">${ver.simbolo}</span></td><td>${sel}</td><td>${sel2}</td><td>${fmt(c(ver.precio))} <span class="mut">${dest}${conv ? "*" : ""}</span></td><td>${fpct(ver.var_pct)}</td><td>${fvol(ver.volumen)} <span class="mut">${ver.mercado.startsWith("BYMA") ? "acc." : "acc."}</span></td><td>${fmt(c(ver.max52))}</td><td>${fmt(c(ver.min52))}</td><td>${spark(ver.serie)}</td></tr>`;
  }).join("");
  return `<h2>${titulo}</h2><div class="wrap"><table><thead><tr><th>Empresa</th><th>Mercado</th><th>Ver en</th><th>Último</th><th>Var. día</th><th>Volumen negociado</th><th>Máx 52s</th><th>Mín 52s</th><th>30 días</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="sub">* Convertido con el tipo de cambio elegido arriba (${state.tc.toUpperCase()} para ARS) y los cruces de Yahoo Finance. Volumen = acciones negociadas en el mercado seleccionado, en su sesión actual o la última disponible.</div>`;
}
function vFuentes() {
  return `<h2>Fuentes</h2><div class="wrap"><table><thead><tr><th>Fuente</th><th>Estado</th><th>Acceso</th><th>Nota</th></tr></thead><tbody>${Object.entries(TABLERO.fuentes).map(([k, f]) => `<tr><td><b>${k}</b></td><td class="${f.habilitada ? "up" : "mut"}">${f.habilitada ? "Activa" : "No activa"}</td><td style="white-space:normal">${f.tipo}</td><td style="white-space:normal;text-align:left">${f.nota}</td></tr>`).join("")}</tbody></table></div>
  ${TABLERO.errores.length ? `<h2>Errores de la última corrida</h2><ul>${TABLERO.errores.map((e) => `<li>${e}</li>`).join("")}</ul>` : ""}`;
}

function render() {
  const D = window.TABLERO; if (!D) { $("#gen").textContent = "Sin datos: corré collector.mjs"; return; }
  const g = new Date(D.generado);
  $("#gen").textContent = "Última actualización: " + g.toLocaleString("es-AR");
  const w = $("#warn"); w.hidden = !D.errores.length; w.textContent = D.errores.length ? `${D.errores.length} componente(s) sin datos en la última corrida. Ver pestaña Fuentes.` : "";
  $("#tc").innerHTML = D.dolar_ar.filter((d) => !d.error).map((d) => `<option value="${d.id}" ${d.id === state.tc ? "selected" : ""}>${d.nombre}</option>`).join("");
  $("#nav").innerHTML = TABS.map(([k, l]) => `<button class="${k === state.tab ? "on" : ""}" data-tab="${k}">${l}</button>`).join("");
  const v = { resumen: vResumen, monedas: vMonedas, bonos: vBonos, commodities: () => vSimple(D.commodities, "Commodities (USD)"), indices: () => vSimple(D.indices, "Índices bursátiles"), acc_ar: () => vAcciones(D.acciones_argentinas, "Acciones de empresas argentinas", "a"), acc_ex: () => vAcciones(D.acciones_extranjeras, "Acciones de empresas extranjeras", "e"), fuentes: vFuentes }[state.tab];
  $("#main").innerHTML = v();
  $("#foot").textContent = "Datos con fines informativos, pueden tener demora. No constituyen asesoramiento financiero.";
}
document.addEventListener("click", (e) => { const t = e.target.dataset?.tab; if (t) { state.tab = t; save(); render(); } });
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.id === "tc") state.tc = el.value;
  else if (el.dataset.t === "ver") state.ver[el.dataset.k] = el.value;
  else if (el.dataset.t === "en") state.en[el.dataset.k] = el.value;
  save(); render();
});
function recargar() { const s = document.createElement("script"); s.src = "data/latest.js?" + Date.now(); s.onload = () => { render(); s.remove(); }; document.head.appendChild(s); }
$("#reload").onclick = recargar;
setInterval(recargar, 5 * 60 * 1000);
render();
</script>
</body>
</html>
